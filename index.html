<h1>바나비</h1>
<p>바나비는 운영자 본인이 자기 PC에서만 쓰는 개인 비서 프로그램입니다. 일반 이용자에게 제공하지 않습니다.</p>
<p>운영자 본인의 유튜브 채널을 채널 주인으로서 관리하는 데(분석 보기, 운영자가 승인한 영상 올리기와 답글 달기) 구글 허락(OAuth)을 씁니다.</p>
